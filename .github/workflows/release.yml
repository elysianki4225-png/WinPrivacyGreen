name: release

# WinPrivacyGreen releases. Sandboxie helper tags are built and uploaded by build.yml.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  attach-winprivacy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Attach WinPrivacyGreen.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || 'v1.0.0' }}
        run: |
          gh release upload $env:TAG build/Release/WinPrivacyGreen.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
