name: build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test INI editing
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test Sandboxie helper on Windows
        shell: pwsh
        run: >-
          ./sandboxie-recovery/tests/integration.ps1
          -Exe build/sandboxie-recovery/Release/SandboxieRecoverySwitch.exe
          -FakeManager build/sandboxie-recovery/Release/SandboxieRecoveryFakeManager.exe

      - name: Upload WinPrivacyGreen artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPrivacyGreen
          path: build/Release/WinPrivacyGreen.exe

      - name: Upload Sandboxie Recovery Switch artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandboxieRecoverySwitch
          path: build/sandboxie-recovery/Release/SandboxieRecoverySwitch.exe


  release-sandboxie:
    # A draft whose target is the pushed branch receives the tested executable.
    # Do not touch published releases or drafts targeting another branch.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for matching release draft
        id: draft
        shell: bash
        run: |
          version=$(tr -d '\r\n' < sandboxie-recovery/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          tag="sandboxie-recovery-v$version"
          metadata=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" | \
            jq -c --arg tag "$tag" '.[] | select(.tag_name == $tag) | {isDraft: .draft, targetCommitish: .target_commitish}')
          if [[ -z "$metadata" ]]; then
            echo "No matching release draft; nothing to upload."
            exit 0
          fi
          draft=$(jq -r .isDraft <<< "$metadata")
          target=$(jq -r .targetCommitish <<< "$metadata")
          if [[ "$draft" != true || ( "$target" != "$GITHUB_REF_NAME" && "$target" != "$GITHUB_SHA" ) ]]; then
            echo "Release is published or targets a different branch; skipping."
            exit 0
          fi
          head=$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer branch build will handle the draft."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.draft.outputs.ready == 'true'
        with:
          name: SandboxieRecoverySwitch
          path: release-assets
      - name: Attach tested executable and SHA-256 to draft
        if: steps.draft.outputs.ready == 'true'
        shell: bash
        env:
          TAG: ${{ steps.draft.outputs.tag }}
        run: |
          cd release-assets
          sha256sum SandboxieRecoverySwitch.exe > SandboxieRecoverySwitch.sha256.txt
          gh release upload "$TAG" SandboxieRecoverySwitch.exe SandboxieRecoverySwitch.sha256.txt --clobber
