name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Build WinPrivacyGreen.exe
        run: ZIG=zig ./build/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPrivacyGreen
          path: build/WinPrivacyGreen.exe
