name: build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['sandboxie-recovery-v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test INI editing
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test Sandboxie helper on Windows
        shell: pwsh
        run: >-
          ./sandboxie-recovery/tests/integration.ps1
          -Exe build/sandboxie-recovery/Release/SandboxieRecoverySwitch.exe
          -FakeManager build/sandboxie-recovery/Release/SandboxieRecoveryFakeManager.exe

      - name: Upload WinPrivacyGreen artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPrivacyGreen
          path: build/Release/WinPrivacyGreen.exe

      - name: Upload Sandboxie Recovery Switch artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandboxieRecoverySwitch
          path: build/sandboxie-recovery/Release/SandboxieRecoverySwitch.exe

  release-sandboxie:
    # Creating a release draft with a new sandboxie-recovery-v* tag triggers
    # this job. Upload only after the actual Windows executable passes tests.
    if: startsWith(github.ref, 'refs/tags/sandboxie-recovery-v')
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SandboxieRecoverySwitch
          path: release-assets
      - name: Attach tested executable and SHA-256 to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          sha256sum SandboxieRecoverySwitch.exe > SandboxieRecoverySwitch.sha256.txt
          gh release upload "$TAG" SandboxieRecoverySwitch.exe SandboxieRecoverySwitch.sha256.txt --clobber
