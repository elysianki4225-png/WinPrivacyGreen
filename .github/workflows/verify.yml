name: verify

# Runs the real executable on a Windows runner, drives it with clicks,
# checks that a toggle writes the registry and refreshes docs/screenshots.
on:
  workflow_dispatch:
  push:
    branches: [arena/d3d19bd5-winprivacygreen, main]

jobs:
  screenshots:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Launch, click and capture
        shell: pwsh
        run: ./tools/capture.ps1 -Exe build/Release/WinPrivacyGreen.exe

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots

      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "docs: refresh screenshots [skip ci]"
          git push
