name: verify

# Runs the real executable on a Windows runner, drives it with clicks,
# checks that a toggle writes the registry and refreshes docs/screenshots.
on:
  workflow_dispatch:
  push:
    branches: [arena/d3d19bd5-winprivacygreen, main]

jobs:
  screenshots:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-log.txt | Select-String -Pattern "error" | Select-Object -First 20 |
              ForEach-Object { Write-Host "::error file=src::$($_.Line.Trim())" }
            exit 1
          }

      - name: Launch, click and capture
        shell: pwsh
        run: |
          try {
            ./tools/capture.ps1 -Exe build/Release/WinPrivacyGreen.exe 6>&1 | Tee-Object -FilePath capture-log.txt
          } catch {
            Get-Content capture-log.txt -ErrorAction SilentlyContinue | Select-Object -Last 30 |
              ForEach-Object { Write-Host "::error::$($_.ToString().Trim())" }
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots

      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "docs: refresh screenshots [skip ci]"
          git push
